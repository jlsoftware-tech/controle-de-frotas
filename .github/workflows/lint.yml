name: Lint

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: write

jobs:
  lint:
    name: Verificar formatação (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências do Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verificar formatação com Pint
        run: vendor/bin/pint --test

  format:
    name: Corrigir formatação (Pint)
    needs: lint
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências do Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Corrigir formatação com Pint
        run: vendor/bin/pint

      - name: Commit e push das correções
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "style: [ci] corrige formatação do código"
